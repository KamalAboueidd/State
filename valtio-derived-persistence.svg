<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c084fc" />
    </marker>
    <marker id="arrowEmerald" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="780" fill="url(#bgGrad)" rx="16" />
  <rect width="1198" height="778" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="2" rx="16" />

  <!-- Header -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="65" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">VALTIO CORE</text>
    
    <text x="145" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="800">
      Derived State &amp; External Persistence Architecture
    </text>
    <text x="145" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14">
      Reactive Proxy getters, outside-React subscription engine, snapshot serialization &amp; storage hydration
    </text>
  </g>

  <!-- SECTION 1: DERIVED STATE -->
  <g transform="translate(60, 120)">
    <!-- Section Container -->
    <rect width="1080" height="280" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
    <rect width="1080" height="38" rx="12" fill="#131e3a" />
    <rect width="1080" height="2" y="38" fill="#1e293b" />
    <circle cx="24" cy="19" r="5" fill="#38bdf8" />
    <text x="38" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700">
      1. DERIVED &amp; COMPUTED STATE — Native Proxy Getters (Zero Selectors Required)
    </text>

    <!-- Block 1: Proxy Store Definition -->
    <g transform="translate(30, 60)">
      <rect width="320" height="190" rx="8" fill="#0f172a" stroke="#334155" />
      <rect width="320" height="28" rx="8" fill="#1e293b" />
      <text x="14" y="19" fill="#94a3b8" font-family="Consolas, monospace" font-size="12" font-weight="600">DrivedState.js (Proxy Store)</text>

      <text x="16" y="52" fill="#c084fc" font-family="Consolas, monospace" font-size="13">const <tspan fill="#f8fafc">state</tspan> = proxy({</text>
      <text x="28" y="74" fill="#94a3b8" font-family="Consolas, monospace" font-size="13">todos: [ { id: 1, ... } ],</text>
      <text x="28" y="104" fill="#38bdf8" font-family="Consolas, monospace" font-size="13" font-weight="700">get completedCount() {</text>
      <text x="40" y="126" fill="#f8fafc" font-family="Consolas, monospace" font-size="12">return this.todos.filter(</text>
      <text x="52" y="146" fill="#f8fafc" font-family="Consolas, monospace" font-size="12">t =&gt; t.completed</text>
      <text x="40" y="166" fill="#f8fafc" font-family="Consolas, monospace" font-size="12">).length;</text>
      <text x="28" y="184" fill="#38bdf8" font-family="Consolas, monospace" font-size="13">}</text>
      <text x="16" y="200" fill="#c084fc" font-family="Consolas, monospace" font-size="13">});</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M 365,155 L 430,155" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrowCyan)" />
    <text x="398" y="142" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Auto-Track</text>

    <!-- Block 2: Valtio Proxy Interceptor -->
    <g transform="translate(445, 60)">
      <rect width="260" height="190" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
      <rect width="260" height="28" rx="8" fill="#0369a1" fill-opacity="0.25" />
      <text x="130" y="19" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Proxy Getter Evaluation</text>

      <g transform="translate(16, 44)">
        <circle cx="8" cy="14" r="4" fill="#34d399" />
        <text x="20" y="18" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Pure JavaScript Getter</text>
        <text x="20" y="34" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Accessed as normal property</text>

        <circle cx="8" cy="62" r="4" fill="#38bdf8" />
        <text x="20" y="66" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Reactive Dependency</text>
        <text x="20" y="82" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Tracks `todos` mutations automatically</text>

        <circle cx="8" cy="110" r="4" fill="#c084fc" />
        <text x="20" y="114" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Zero Boilerplate</text>
        <text x="20" y="130" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">No createSelector or useMemo!</text>
      </g>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M 720,155 L 780,155" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrowCyan)" />
    <text x="750" y="142" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Snapshot</text>

    <!-- Block 3: React Consumer Component -->
    <g transform="translate(795, 60)">
      <rect width="255" height="190" rx="8" fill="#0f172a" stroke="#334155" />
      <rect width="255" height="28" rx="8" fill="#1e293b" />
      <text x="14" y="19" fill="#94a3b8" font-family="Consolas, monospace" font-size="12" font-weight="600">TodoStats.jsx</text>

      <text x="16" y="52" fill="#c084fc" font-family="Consolas, monospace" font-size="12">const <tspan fill="#f8fafc">snap</tspan> = useSnapshot(state);</text>
      <text x="16" y="80" fill="#64748b" font-family="Consolas, monospace" font-size="11">// Direct property access without ()</text>
      
      <g transform="translate(14, 96)">
        <rect width="225" height="68" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
        <text x="12" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Render Output:</text>
        <text x="12" y="46" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">
          Completed: {snap.completedCount}
        </text>
      </g>
    </g>
  </g>

  <!-- SECTION 2: SUBSCRIPTION & PERSISTENCE -->
  <g transform="translate(60, 430)">
    <!-- Section Container -->
    <rect width="1080" height="300" rx="12" fill="#09141f" stroke="#1e293b" stroke-width="1.5" />
    <rect width="1080" height="38" rx="12" fill="#102537" />
    <rect width="1080" height="2" y="38" fill="#1e293b" />
    <circle cx="24" cy="19" r="5" fill="#34d399" />
    <text x="38" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700">
      2. EXTERNAL PERSISTENCE ENGINE — subscribe(state) + snapshot(state) + localStorage
    </text>

    <!-- Step 1: Mutable Proxy State -->
    <g transform="translate(30, 60)">
      <rect width="230" height="210" rx="8" fill="#0f172a" stroke="#334155" />
      <rect width="230" height="28" rx="8" fill="#1e293b" />
      <text x="14" y="19" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">1. State Mutation</text>
      
      <g transform="translate(14, 46)">
        <rect width="200" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
        <text x="10" y="22" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">state.theme = 'dark';</text>
        <text x="10" y="38" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">state.count++;</text>

        <text x="4" y="80" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Proxy Interception:</text>
        <text x="4" y="100" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" line-height="1.4">
          Mutations immediately fire registered subscription callbacks.
        </text>
      </g>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M 275,160 L 330,160" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arrowEmerald)" />
    <text x="302" y="146" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Fire</text>

    <!-- Step 2: subscribe() Engine -->
    <g transform="translate(345, 60)">
      <rect width="260" height="210" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
      <rect width="260" height="28" rx="8" fill="#065f46" fill-opacity="0.3" />
      <text x="14" y="19" fill="#34d399" font-family="Consolas, monospace" font-size="12" font-weight="700">2. subscribe(state, fn)</text>

      <g transform="translate(14, 46)">
        <text x="0" y="14" fill="#c084fc" font-family="Consolas, monospace" font-size="12">subscribe(state, () =&gt; {</text>
        <text x="12" y="36" fill="#34d399" font-family="Consolas, monospace" font-size="12" font-weight="700">const snap = snapshot(state);</text>
        <text x="12" y="60" fill="#f8fafc" font-family="Consolas, monospace" font-size="11">localStorage.setItem(</text>
        <text x="24" y="80" fill="#fbbf24" font-family="Consolas, monospace" font-size="11">'my-app',</text>
        <text x="24" y="100" fill="#f8fafc" font-family="Consolas, monospace" font-size="11">JSON.stringify(snap)</text>
        <text x="12" y="120" fill="#f8fafc" font-family="Consolas, monospace" font-size="11">);</text>
        <text x="0" y="140" fill="#c084fc" font-family="Consolas, monospace" font-size="12">});</text>
      </g>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M 620,160 L 675,160" stroke="#c084fc" stroke-width="2.5" fill="none" marker-end="url(#arrowPurple)" />
    <text x="648" y="146" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Serialize</text>

    <!-- Step 3: snapshot() Freezing -->
    <g transform="translate(690, 60)">
      <rect width="180" height="210" rx="8" fill="#0f172a" stroke="#334155" />
      <rect width="180" height="28" rx="8" fill="#1e293b" />
      <text x="90" y="19" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3. snapshot(state)</text>

      <g transform="translate(14, 46)">
        <rect width="150" height="42" rx="6" fill="#1e293b" stroke="#c084fc" />
        <text x="75" y="26" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Deep Frozen Copy</text>
        
        <text x="0" y="74" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">
          ✓ Immutable Object
        </text>
        <text x="0" y="96" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">
          ✓ Safe for JSON stringify
        </text>
        <text x="0" y="118" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">
          ✓ No circular proxy traps
        </text>
      </g>
    </g>

    <!-- Arrow 3 to 4 -->
    <path d="M 885,160 L 935,160" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arrowEmerald)" />
    <text x="910" y="146" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Store</text>

    <!-- Step 4: LocalStorage & Boot Hydration -->
    <g transform="translate(950, 60)">
      <rect width="195" height="210" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <rect width="195" height="28" rx="8" fill="#065f46" fill-opacity="0.3" />
      <text x="97" y="19" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4. Storage &amp; Hydrate</text>

      <g transform="translate(12, 44)">
        <rect width="170" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="85" y="28" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
          💾 LocalStorage
        </text>

        <text x="0" y="74" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">App Startup Hydration:</text>
        <text x="0" y="94" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">const saved =</text>
        <text x="0" y="108" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">JSON.parse(storage);</text>
        <text x="0" y="130" fill="#38bdf8" font-family="Consolas, monospace" font-size="10">export const state =</text>
        <text x="0" y="144" fill="#38bdf8" font-family="Consolas, monospace" font-size="10">proxy(saved || init);</text>
      </g>
    </g>
  </g>
</svg>
